const prizes=[{key:'coins',n:80,w:35,icon:'🪙'},{key:'coins',n:150,w:25,icon:'💰'},{key:'coins',n:300,w:15,icon:'💎'},{key:'boost',n:1,w:12,icon:'⚡'},{key:'speed',n:1,w:8,icon:'🚗'},{key:'free',n:1,w:5,icon:'🎟'}];function prizeName(p){return p.key==='coins'?p.n+' '+t('coins'):t(p.key+'Name')+' ×1'}function spinControls(){if(!$('spinGo'))return;let wait=Math.max(0,Math.ceil((state.nextTicket-Date.now())/1000));$('tickets').textContent=t('tickets')+'：'+state.tickets;$('spinGo').disabled=spinning||!state.tickets;$('spinGo').textContent=t(spinning?'spinning':'spinNow');$('claim').disabled=spinning||wait>0;$('claim').textContent=wait?t('next')+' '+Math.floor(wait/60)+':'+String(wait%60).padStart(2,'0'):t('claim')}function showSpin(){modal('spin','<h2>🎰 '+t('lottery')+'</h2><p>'+t('lotteryInfo')+'</p><div class="small" id="tickets"></div><div class="reels">'+[0,1,2].map(i=>'<div class="reel" id="reel'+i+'">'+(spinPrize?spinPrize.icon:['🪙','⚡','🎟'][i])+'</div>').join('')+'</div><div class="result" id="result">'+(spinPrize?t('win')+' '+prizeName(spinPrize):'🍀')+'</div><button class="primary" id="spinGo"></button><p><button id="claim"></button></p><div class="odds">'+t('odds')+'</div>');$('claim').onclick=()=>{if(spinning||Date.now()<state.nextTicket)return;state.tickets++;state.nextTicket=Date.now()+120000;sound('item');save();ui()};$('spinGo').onclick=startSpin;spinControls()}
function startSpin(){if(spinning||state.tickets<1)return;state.tickets--;spinning=true;let v=Math.random()*100,p=prizes[0],sum=0;for(let q of prizes){sum+=q.w;if(v<sum){p=q;break}}if(p.key==='coins')state.money+=p.n;else state.items[p.key]++;spinPrize=p;save();$('closeModal').disabled=true;$('result').textContent=t('spinning');spinControls();let ticks=0;for(let i=0;i<3;i++)if(state.anim)$('reel'+i).classList.add('roll');let timer=setInterval(()=>{ticks++;if(ticks%2===0)sound('tick');for(let i=0;i<3;i++){let e=$('reel'+i);if(ticks>10+i*5){e.textContent=p.icon;e.classList.remove('roll')}else e.textContent=prizes[Math.floor(Math.random()*prizes.length)].icon}},95);setTimeout(()=>{clearInterval(timer);spinning=false;for(let i=0;i<3;i++){$('reel'+i).textContent=p.icon;$('reel'+i).classList.remove('roll')}$('result').textContent='🎉 '+t('win')+' '+prizeName(p);$('closeModal').disabled=false;sound('win');ui();save()},state.anim?2500:450)}
function showSettings(){modal('settings','<h2>⚙ '+t('settings')+'</h2><div class="soundBox"><button id="toggleMusic">🎵 '+t('music')+'：'+t(state.music?'on':'off')+'</button> <button id="toggleSfx">🔔 '+t('sfx')+'：'+t(state.sfx?'on':'off')+'</button><label for="musicVol">'+t('musicVolume')+' <span id="musicPct">'+Math.round(state.musicVolume*100)+'%</span></label><input class="volume" id="musicVol" type="range" min="0" max="100" value="'+Math.round(state.musicVolume*100)+'"><label for="sfxVol">'+t('sfxVolume')+' <span id="sfxPct">'+Math.round(state.sfxVolume*100)+'%</span></label><input class="volume" id="sfxVol" type="range" min="0" max="100" value="'+Math.round(state.sfxVolume*100)+'"><p class="small">'+t('audioInfo')+'</p></div><p>'+t('help')+'</p><p class="small">'+t('saveInfo')+'</p><button id="animToggle">'+t('anim')+'：'+t(state.anim?'on':'off')+'</button> <button id="replay">👆 '+t('replay')+'</button><p><button class="danger" id="reset">'+t('reset')+'</button></p>');$('toggleMusic').onclick=()=>{state.music=!state.music;unlockAudio();applyAudio();ui();save();showSettings()};$('toggleSfx').onclick=()=>{state.sfx=!state.sfx;applyAudio();if(state.sfx)sound('item');save();showSettings()};[['musicVol','musicVolume','musicPct'],['sfxVol','sfxVolume','sfxPct']].forEach(([id,key,pct])=>{$(id).oninput=()=>{state[key]=Number($(id).value)/100;$(pct).textContent=Math.round(state[key]*100)+'%';applyAudio();save()};if(id==='sfxVol')$(id).onchange=()=>sound('item')});$('animToggle').onclick=()=>{state.anim=!state.anim;save();showSettings()};$('replay').onclick=()=>{tutorial=true;state.tutorial=true;home();closeModal();ui();save()};$('reset').onclick=()=>{if(confirm(t('resetAsk'))){try{localStorage.removeItem(KEY)}catch(e){}location.reload()}}}
$('musicBtn').onclick=()=>{state.music=!state.music;unlockAudio();applyAudio();save();ui();toast(t(state.music?'musicOn':'musicOff'))};$('lang').onchange=()=>{state.lang=$('lang').value;save();ui();if(selected!==null)showCity(cities[selected]);if(modalType==='settings')showSettings();else if(modalType==='items')showItems();else if(modalType==='world')showWorld();else if(modalType==='spin'&&!spinning)showSpin()};$('worldBtn').onclick=showWorld;$('settingsBtn').onclick=showSettings;$('itemsBtn').onclick=showItems;$('spinBtn').onclick=showSpin;$('drawBtn').onclick=hidePanel;$('homeBtn').onclick=()=>{home();hidePanel()};$('skip').onclick=endTutorial;
cv.addEventListener('pointerdown',e=>{if(modalType)return;cv.setPointerCapture(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pointers.size===1){let c=hit(e.clientX,e.clientY);pan={x:e.clientX,y:e.clientY,cx:cam.x,cy:cam.y,moved:false};if(c){hidePanel();draft={a:c.id,points:[{x:c.x,y:c.y}],travel:0,origin:{x:e.clientX,y:e.clientY}}}}if(pointers.size===2){draft=null;hover=null;let ps=[...pointers.values()];pinch={d:dist(ps[0],ps[1]),z:cam.z};pan.moved=true}});cv.addEventListener('pointermove',e=>{if(!pointers.has(e.pointerId))return;pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pointers.size===2&&pinch){let ps=[...pointers.values()];cam.z=Math.max(.25,Math.min(3,pinch.z*dist(ps[0],ps[1])/pinch.d));return}if(draft){let prev=draft.travel;draft.travel=Math.max(draft.travel,Math.hypot(e.clientX-draft.origin.x,e.clientY-draft.origin.y));if(draft.travel<9)return;if(prev<9)sound('start');let p=world(e.clientX,e.clientY),ps=draft.points;if(ps.length<1000&&dist(ps[ps.length-1],p)>3/cam.z)ps.push(p);hover=hit(e.clientX,e.clientY);if(hover?.id===draft.a)hover=null;return}if(pan){let dx=e.clientX-pan.x,dy=e.clientY-pan.y;if(Math.hypot(dx,dy)>6)pan.moved=true;if(pan.moved){cam.x=pan.cx-dx/cam.z;cam.y=pan.cy-dy/cam.z}}});cv.addEventListener('pointerup',e=>{if(draft&&pointers.size===1){draft.travel=Math.max(draft.travel,Math.hypot(e.clientX-draft.origin.x,e.clientY-draft.origin.y));finish(e.clientX,e.clientY)}else if(pan&&!pan.moved&&pointers.size===1){let p=world(e.clientX,e.clientY);if(regions.some((r,i)=>!state.open.includes(i)&&inPoly(p,r.poly)))showWorld();else hidePanel()}pointers.delete(e.pointerId);if(!pointers.size){pan=null;pinch=null}else{let p=[...pointers.values()][0];pan={...p,cx:cam.x,cy:cam.y,moved:true}}});cv.addEventListener('pointercancel',()=>{draft=null;hover=null;pan=null;pinch=null;pointers.clear()});cv.addEventListener('wheel',e=>{e.preventDefault();if(draft)return;let a=world(e.clientX,e.clientY);cam.z=Math.max(.25,Math.min(3,cam.z*Math.exp(-e.deltaY*.001)));let b=world(e.clientX,e.clientY);cam.x+=a.x-b.x;cam.y+=a.y-b.y},{passive:false});addEventListener('keydown',e=>{if(e.key==='Escape'){draft=null;hover=null;hidePanel();if(!spinning)closeModal()}});addEventListener('pagehide',save);document.addEventListener('visibilitychange',()=>{last=performance.now();if(document.hidden){save();if(ac&&ac.state==='running')ac.suspend().catch(()=>{})}else if(audioReady&&ac){nextBeat=ac.currentTime+.08;ac.resume().then(applyAudio).catch(()=>{})}});
function frame(ms){let dt=Math.min(.1,(ms-(last||ms))/1000);last=ms;cars.forEach(car=>{car.t+=car.dir*speed(car.r)*(Date.now()<state.speedEnd?1.6:1)/car.r.len*dt;if(car.t>=1||car.t<=0){car.t=Math.max(0,Math.min(1,car.t));let c=cities[car.t===1?car.r.b:car.r.a],n=pay(car.r)*(Date.now()<state.boostEnd?2:1);state.money+=n;for(let id of [car.r.a,car.r.b])state.totals[id]=(state.totals[id]||0)+n/2;car.dir*=-1;if(state.anim&&fx.length<28)fx.push({x:c.x,y:c.y-28,n,life:1.2})}});fx.forEach(f=>{f.life-=dt;if(!f.emoji)f.y-=22*dt});fx=fx.filter(f=>f.life>0);confetti.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=85*dt;p.life-=dt});confetti=confetti.filter(p=>p.life>0);clock+=dt;saveClock+=dt;if(clock>.4){clock=0;ui()}if(saveClock>5){saveClock=0;save()}render(ms);requestAnimationFrame(frame)}ui();requestAnimationFrame(frame);if(offline)toast(t('offline')+' +'+fmt(offline)+' '+t('coins'));
})();</script></body></html>
